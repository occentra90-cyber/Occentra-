name: SnapScan regression tests
on:
  pull_request:
    paths:
      - 'lib/snapscan*.ts'
      - 'app/api/snapscan/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/snapscan-tests.yml'
  push:
    branches: [main]
    paths:
      - 'lib/snapscan*.ts'
      - 'app/api/snapscan/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
jobs:
  snapscan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
